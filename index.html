<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: eine Spalte am Handy, feste Tableiste unten; ab 900px zwei Spalten (Tag links, Routinen rechts), Woche als 7er-Raster */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#13231F; --muted:#5B6B66; --line:#DCE4E0;
  --accent:#0F6F66; --accent-soft:#DCEFEA; --on-accent:#FFFFFF;
  --warm:#9A5C08; --warm-soft:#FBEFD9; --bad:#B3362B; --bad-soft:#FADFDB;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --ink:#E7EFEC; --muted:#93A6A0; --line:#27362F;
  --accent:#5CC9BB; --accent-soft:#17332F; --on-accent:#08201C;
  --warm:#E5B15A; --warm-soft:#3A2D14; --bad:#F08A7E; --bad-soft:#40201C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --ink:#E7EFEC; --muted:#93A6A0; --line:#27362F;
  --accent:#5CC9BB; --accent-soft:#17332F; --on-accent:#08201C;
  --warm:#E5B15A; --warm-soft:#3A2D14; --bad:#F08A7E; --bad-soft:#40201C; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 96px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:14px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,38px);line-height:1.05;margin:2px 0 0;text-wrap:balance}
.daynav{display:flex;gap:6px;margin-left:auto}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:42px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;background:var(--accent-soft);color:var(--ink)}
.chip.warm{background:var(--warm-soft)}
.chip b{font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 8px}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 2px}
ul.rows{list-style:none;margin:6px 0 0;padding:0}
ul.rows>li{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:10px;align-items:flex-start;min-width:0}
ul.rows>li:first-child{border-top:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px;font-size:14px;padding-top:1px}
.past{opacity:.5}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:13px}
label.chk{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);background:var(--surface);margin:0;display:grid;place-content:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
input[type=checkbox]:checked+.grow .ttl{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;background:var(--accent-soft);margin-left:6px;white-space:nowrap}
.tag.warm{background:var(--warm-soft);color:var(--warm)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.plain{background:none;border:1px solid var(--line);color:var(--muted)}
.pause{color:var(--muted);font-style:italic}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px}
table.ex{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
table.ex td{border-top:1px solid var(--line);padding:5px 0}
table.ex td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;padding-left:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.danger{color:var(--bad)}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.iconbtn{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:8px;font-size:18px;line-height:1}
form.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
form.add input[type=text]{flex:1 1 200px;min-width:0}
form.add input,form.add select,.edit input,.edit select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.edit{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.banner{border-radius:12px;padding:9px 12px;background:var(--warm-soft);font-size:14px;margin-bottom:14px}
.week{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day button.dhead{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:8px;width:100%;font-family:var(--display);font-weight:700;font-size:17px}
.day button.dhead span{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.day .line{font-size:13.5px;margin-top:6px;overflow-wrap:anywhere}
.day .line .t{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.day .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:10px}
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.empty{color:var(--muted);padding:8px 0}
@media (min-width:900px){
  .wrap{padding-block:26px 40px}
  nav.tabs{position:static;border:1px solid var(--line);border-radius:12px;padding:4px;display:inline-flex;margin-bottom:16px}
  nav.tabs button{padding:8px 18px}
  .grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .day{padding:10px}
}
@media (prefers-reduced-motion:no-preference){ input[type=checkbox]{transition:background .12s,border-color .12s} }

[hidden]{display:none!important}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin:-6px 0 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--accent)} .dot.wait{background:var(--warm)} .dot.bad{background:var(--bad)}
.field{display:grid;gap:4px;margin-top:10px}
.field label{font-size:13px;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;width:100%}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.plate{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.exhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.exhead>div{min-width:0}
.sets{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 58px 44px;gap:6px 8px;align-items:center;margin-top:10px}
.sets .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.setno{font-family:var(--display);font-weight:700;font-size:17px;text-align:center}
.last{grid-column:2/6;font-size:12.5px;color:var(--muted);margin-top:-3px}
input.num,select.rir{width:100%;min-width:0;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
input.num.tgt{color:var(--muted);font-style:italic;font-weight:500}
input.num.left{text-align:left;font-size:15px;font-weight:500}
select.swap{max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.setcheck{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:none;font-weight:700;font-size:19px;color:var(--muted)}
.setcheck.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.unitpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.unitpick button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:600;text-align:left;min-width:0}
.unitpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hint{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px;margin-top:6px}
.bar{height:9px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.mrow{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 4.6em;gap:10px;align-items:center;font-size:14px;margin-top:8px}
.mrow .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px 18px}
.tile{min-width:0}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .big.good{color:var(--accent)} .tile .big.mid{color:var(--warm)} .tile .big.low{color:var(--bad)}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.timer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.timer .in{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 10px 8px 16px;max-width:520px;width:100%}
.timer .tt{font-family:var(--display);font-weight:700;font-size:26px;flex:1;font-variant-numeric:tabular-nums}
.timer.over .tt{color:var(--accent-soft)}
.timer button{border:0;border-radius:8px;padding:8px 10px;background:var(--muted);color:var(--bg);font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px;text-decoration:underline}
@media (max-width:899px){nav.tabs button{font-size:14px;padding:10px 2px}}
@media (min-width:900px){.timer{bottom:16px}.tr-narrow{max-width:640px}}
.focus{margin:2px 0 16px}
.focus blockquote{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(18px,4.8vw,23px);line-height:1.25;text-wrap:balance}
.focus .by{color:var(--muted);font-size:13px;margin-top:4px;min-height:1em}
.goals{display:grid;gap:10px 22px;grid-template-columns:minmax(0,1fr);margin-top:14px}
.goal label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.goal .gr{display:flex;gap:10px;align-items:center}
.goal input[type=text]{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;font-size:15.5px;font-weight:500;border-radius:0}
.goal input[type=text]:focus{outline:0;border-bottom-color:var(--accent)}
.goal input[type=checkbox]:checked+input[type=text]{text-decoration:line-through;color:var(--muted)}
dl.imp{margin:8px 0 0;display:grid;gap:10px 22px;grid-template-columns:minmax(0,1fr)}
dl.imp dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
dl.imp dd{margin:2px 0 0;max-width:68ch}
@media (min-width:900px){.goals{grid-template-columns:repeat(2,minmax(0,1fr))}dl.imp{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="title">Dashboard</h1>
    </div>
    <div class="daynav" id="daynav">
      <button type="button" data-act="prev" aria-label="Zurück">‹</button>
      <button type="button" data-act="today">Heute</button>
      <button type="button" data-act="next" aria-label="Weiter">›</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Ansicht">
    <button type="button" role="tab" data-tab="heute">Heute</button>
    <button type="button" role="tab" data-tab="woche">Woche</button>
    <button type="button" role="tab" data-tab="training">Training</button>
    <button type="button" role="tab" data-tab="aufgaben">Aufgaben</button>
    <button type="button" role="tab" data-tab="einst" aria-label="Einstellungen" style="flex:0 0 52px">⚙︎</button>
  </nav>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="banner" id="banner" hidden></div>
  <section class="focus" id="focus" hidden>
    <blockquote id="q-text"></blockquote>
    <div class="by" id="q-by"></div>
    <div class="goals">
      <div class="goal"><label for="g-week" id="g-week-l">Ziel der Woche</label><div class="gr"><input type="checkbox" id="g-week-d" aria-label="Wochenziel erreicht"><input type="text" id="g-week" maxlength="200" placeholder="Was soll diese Woche fertig werden?" autocomplete="off"></div></div>
      <div class="goal"><label for="g-month" id="g-month-l">Ziel des Monats</label><div class="gr"><input type="checkbox" id="g-month-d" aria-label="Monatsziel erreicht"><input type="text" id="g-month" maxlength="200" placeholder="Was soll diesen Monat erreicht sein?" autocomplete="off"></div></div>
    </div>
  </section>
  <div class="chips" id="chips"></div>
  <main id="main"></main>
  <section class="panel" id="addpanel" style="margin-top:16px">
    <h2>Neue Aufgabe</h2>
    <form class="add" id="addform">
      <input type="text" id="add-title" placeholder="Was steht an?" maxlength="200" required aria-label="Aufgabe">
      <input type="date" id="add-due" aria-label="Fällig am">
      <select id="add-area" aria-label="Bereich">
        <option>Privat</option><option>Beruf</option><option>Gewerbe</option><option>Immobilien</option>
      </select>
      <button class="btn primary" type="submit">Hinzufügen</button>
    </form>
  </section>
  <section class="panel" id="setpanel" hidden>
    <h2>Verbindung zum Google Sheet</h2>
    <p class="sub">Web-App-URL und Token aus dem Apps Script im Sheet „Dashboard". Beides wird nur auf diesem Gerät gespeichert.</p>
    <form id="cfgform">
      <div class="field"><label for="cfg-url">Web-App-URL (endet auf /exec)</label><input type="url" id="cfg-url" autocomplete="off" autocapitalize="off" spellcheck="false" required></div>
      <div class="field"><label for="cfg-token">Token</label><input type="text" id="cfg-token" autocomplete="off" autocapitalize="off" spellcheck="false" required></div>
      <div class="rowbtns"><button class="btn primary" type="submit">Speichern und verbinden</button><button class="btn" type="button" id="reload">Jetzt aktualisieren</button></div>
      <p class="sub" id="cfg-msg" style="margin-top:10px" aria-live="polite"></p>
    </form>
    <h2 style="margin-top:20px">Wetter-Ort</h2>
    <p class="sub" id="loc-cur"></p>
    <form class="add" id="locform">
      <input type="text" id="loc-q" placeholder="Stadt suchen" maxlength="80" aria-label="Stadt suchen">
      <button class="btn primary" type="submit">Suchen</button>
      <button class="btn" type="button" id="loc-reset">Standard-Ort</button>
    </form>
    <div class="rowbtns" id="loc-res"></div>
  </section>
</div>
<div class="timer" id="timer" hidden><div class="in"><span>Pause</span><span class="tt" id="timerT">0:00</span><button id="tMinus" type="button">−15</button><button id="tPlus" type="button">+15</button><button id="tStop" type="button">Fertig</button></div></div>
<script>
(function(){
"use strict";
/* ---------- Datum ---------- */
const DAY=86400000, WD=["So","Mo","Di","Mi","Do","Fr","Sa"], WDL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const mk=(y,m,d)=>new Date(y,m-1,d);
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromKey=k=>{const p=k.split("-").map(Number);return mk(p[0],p[1],p[2])};
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const diff=(a,b)=>Math.round((day0(a)-day0(b))/DAY);
const monday=d=>add(d,-((d.getDay()+6)%7));
const short=d=>d.getDate()+"."+(d.getMonth()+1)+".";
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
function kw(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/DAY-3+((f.getUTCDay()+6)%7))/7)}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Plan: kommt aus dem Google Sheet, hier steht nur die Auswertung ---------- */
let PLAN=null;
const TR=()=>(PLAN&&PLAN.training)||{};
const units=()=>TR().units||[];
const unitById=id=>units().find(u=>u.id===id)||null;
const exOf=u=>(TR().exercises&&TR().exercises[u])||[];
let MUS=null,MUSP=null;
function muscleOf(n,fb){if(MUSP!==PLAN){MUSP=PLAN;MUS={};const T=TR();Object.keys(T.alts||{}).forEach(m=>T.alts[m].forEach(x=>{MUS[x]=m}));Object.keys(T.exercises||{}).forEach(u=>T.exercises[u].forEach(e=>{MUS[e.n]=e.m}))}return MUS[n]||fb||""}
const byN=()=>S.sessions.slice().sort((x,y)=>x.n-y.n);
const doneSets=s=>Object.values(s.sets||{}).filter(v=>v&&v.done).length;
function slot(c){if(!c)return null;if(c.unit){const u=unitById(c.unit);return Object.assign({gym:true,name:u?u.name:c.unit,sub:u?u.sub||"":"",ex:exOf(c.unit).map(e=>[e.n,e.s+" × "+e.r])},c)}return Object.assign({name:"Pause",sub:""},c)}
let SCH=null;
/* Plan ab der letzten echten Einheit: verpasste Gym-Tage rücken nach, Pausentage zählen weiter */
function sched(){if(SCH)return SCH;const C=TR().cycle||[],real=byN().filter(s=>doneSets(s)).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.n-y.n),by={};
  real.forEach(s=>{by[s.date]=s});let pos=0;const last=real[real.length-1];
  if(last&&C.length){pos=Math.max(0,C.findIndex(c=>c.unit===last.unit));let d=fromKey(last.date);
    while(d<TODAY){d=add(d,1);const nx=(pos+1)%C.length;if(d<TODAY&&C[nx].unit)continue;pos=nx}}
  SCH={by:by,pos:pos,has:!!last};return SCH}
function training(d){const T=TR(),C=T.cycle||[];if(!C.length)return null;const sc=sched(),k=key(d),s=sc.by[k];
  if(s){const cs=C.find(c=>c.unit===s.unit)||{};return Object.assign({},slot(Object.assign({},cs,{unit:s.unit})),{session:s,state:s.done?"done":"open"})}
  if(d<TODAY)return (sc.has||(T.start&&k>=T.start))?{name:"Kein Training eingetragen",sub:"",past:true}:null;
  if(sc.has)return Object.assign({state:"plan"},slot(C[(sc.pos+diff(d,TODAY))%C.length]));
  if(!T.start)return null;const n=diff(d,fromKey(T.start));return n<0?null:Object.assign({state:"plan"},slot(C[n%C.length]))}
function phase(d){const ph=(PLAN&&PLAN.routine&&PLAN.routine.phases)||[],k=key(d);let cur=null;ph.forEach(p=>{if(p.from<=k)cur=p});return cur}
function ruleOn(r,d,p){const k=key(d);
  if(r.days&&r.days.indexOf(d.getDay())<0)return false;
  if(r.phases&&(!p||r.phases.indexOf(p.id)<0))return false;
  if(r.notPhases&&p&&r.notPhases.indexOf(p.id)>=0)return false;
  if(r.first&&d.getDate()>7)return false;
  if(r.from&&k<r.from)return false;
  if(r.every){if(!p)return false;const n=diff(d,fromKey(p.from));if(((n%r.every)+r.every)%r.every!==(r.offset||0))return false}
  return true}
function skincare(d){const R=PLAN&&PLAN.routine;if(!R)return[];const p=phase(d),L=[];
  (R.items||[]).forEach(r=>{if(!ruleOn(r,d,p))return;
    if(r.ifMissing){if(!L.some(x=>x.id===r.ifMissing)&&!L.some(x=>x.info&&x.g===r.g))L.push({g:r.g,info:r.info,s:r.s||r.info});return}
    if(L.some(x=>x.id===r.id))return;
    L.push({g:r.g,id:r.id,t:r.t,s:r.s||r.t,n:r.n||"",opt:r.opt,strength:r.strength,hideWeek:r.hideWeek})});
  return L}
const phaseLabel=d=>{const p=phase(d);return p?p.label:""};
const tTitle=()=>(PLAN&&PLAN.training&&PLAN.training.title)||"Plan";
const rTitle=()=>(PLAN&&PLAN.routine&&PLAN.routine.title)||"Routine";

/* ---------- Zustand ---------- */
const TODAY=day0(new Date());
const S={tab:"heute",day:TODAY,week:monday(TODAY),tasks:[],checks:{},events:null,evStamp:null,evMsg:"",shift:0,openTask:null,showDone:false,sync:"",syncErr:"",stampMs:0,sessions:[],days:{},whoop:null,trSub:"einheit",pickUnit:null,openHist:null,weekOff:0,quotes:[],impulses:[],goals:{}};
const $=id=>document.getElementById(id);
let localId=0;

/* ---------- Termine ---------- */
function normEvents(list){return (list||[]).map(e=>e.allDay&&e.sk?{title:e.title,allDay:true,s:+fromKey(e.sk),e:+fromKey(e.ek||e.sk),loc:e.loc||""}:{title:e.title,allDay:!!e.allDay,s:e.s,e:e.e,loc:e.loc||""}).filter(e=>!isNaN(e.s)).sort((a,b)=>a.s-b.s)}
function eventsOn(d){if(!S.events)return[];const a=+d,b=+add(d,1);return S.events.filter(e=>e.s<b&&(e.e>a||e.s>=a))}
function evTime(e,d){if(e.allDay)return"ganztägig";const s=new Date(e.s),en=new Date(e.e);return (+day0(s)===+d?hm(s):"…")+"–"+(+day0(en)===+d?hm(en):"…")}

/* ---------- Aufgaben ---------- */
const openTasks=()=>S.tasks.filter(t=>!t.done);
function tasksFor(d){const k=key(d);return openTasks().filter(t=>t.due===k)}
function overdue(){const k=key(TODAY);return openTasks().filter(t=>t.due&&t.due<k).sort((a,b)=>a.due<b.due?-1:1)}
function taskRow(t,ctx){const k=key(TODAY);let tag="";
  if(t.due){const d=fromKey(t.due);if(!t.done&&t.due<k)tag='<span class="tag bad">überfällig seit '+short(d)+'</span>';else if(ctx!=="day")tag='<span class="tag plain">'+WD[d.getDay()]+" "+short(d)+'</span>'}
  const open=S.openTask===t.id;
  return '<li><div class="grow"><div style="display:flex;gap:10px;align-items:flex-start"><label class="chk"><input type="checkbox" id="task-'+esc(t.id)+'" data-task="'+esc(t.id)+'"'+(t.done?" checked":"")+'><span class="grow"><span class="ttl">'+esc(t.title)+'</span><span class="tag">'+esc(t.area||"Privat")+'</span>'+tag+'</span></label><button type="button" class="iconbtn" data-edit="'+esc(t.id)+'" aria-label="Aufgabe bearbeiten" aria-expanded="'+open+'">⋯</button></div>'+
   (open?'<div class="edit"><input type="date" id="due-'+esc(t.id)+'" value="'+esc(t.due||"")+'" data-due="'+esc(t.id)+'" aria-label="Fällig am"><button type="button" class="btn" data-move="'+esc(t.id)+'" data-to="'+key(TODAY)+'">Heute</button><button type="button" class="btn" data-move="'+esc(t.id)+'" data-to="'+key(add(TODAY,1))+'">Morgen</button><button type="button" class="btn" data-move="'+esc(t.id)+'" data-to="">Ohne Datum</button><button type="button" class="btn danger" data-del="'+esc(t.id)+'">Löschen</button></div>':"")+'</div></li>'}

/* ---------- Abhaken ---------- */
const done=(k,id)=>!!(S.checks[k]&&S.checks[k].done&&S.checks[k].done[id]);
function chkRow(k,it){return '<li><label class="chk"><input type="checkbox" id="c-'+k+"-"+it.id+'" data-chk="'+it.id+'" data-day="'+k+'"'+(it.strength?' data-strength="'+esc(it.strength)+'"':"")+(done(k,it.id)?" checked":"")+'><span class="grow"><span class="ttl">'+esc(it.t)+'</span>'+(it.opt?'<span class="tag plain">optional</span>':"")+(it.n?'<div class="note">'+esc(it.n)+'</div>':"")+'</span></label></li>'}

/* ---------- Ansichten ---------- */
function viewDay(){const d=S.day,k=key(d),isToday=+d===+TODAY,now=Date.now();
  const ev=eventsOn(d);
  let h=viewOverview(d)+'<div class="grid two"><div class="grid">';
  h+='<section class="panel"><h2>Termine <small>'+(S.evStamp?"Stand "+S.evStamp:"")+'</small></h2>';
  if(S.evMsg)h+='<p class="sub">'+esc(S.evMsg)+'</p>';
  if(S.events===null)h+='<p class="empty">'+(CFG.url?"Kalender wird geladen …":"Noch nicht verbunden. Unter ⚙︎ die Web-App-URL und das Token eintragen.")+'</p>';
  else if(!ev.length)h+='<p class="empty">Keine Termine an diesem Tag.</p>';
  else h+='<ul class="rows">'+ev.map(e=>'<li class="'+(isToday&&!e.allDay&&e.e<now?"past":"")+'"><span class="time">'+evTime(e,d)+'</span><span class="grow">'+esc(e.title)+(e.loc?'<div class="note">'+esc(e.loc)+'</div>':"")+'</span></li>').join("")+'</ul>';
  h+='</section>';
  const od=isToday?overdue():[],td=tasksFor(d),nodate=openTasks().filter(t=>!t.due);
  h+='<section class="panel"><h2>Aufgaben <small>'+(od.length+td.length)+' offen</small></h2>';
  if(!od.length&&!td.length)h+='<p class="empty">'+(isToday?"Für heute ist nichts fällig.":"An diesem Tag ist nichts fällig.")+'</p>';
  else h+='<ul class="rows">'+od.map(t=>taskRow(t,"day")).join("")+td.map(t=>taskRow(t,"day")).join("")+'</ul>';
  if(isToday&&nodate.length)h+='<details><summary>'+nodate.length+' ohne Datum</summary><ul class="rows">'+nodate.map(t=>taskRow(t,"day")).join("")+'</ul></details>';
  h+='</section></div><div class="grid">';
  const t=training(d);
  h+='<section class="panel"><h2>'+esc(tTitle());
  if(!PLAN)h+='</h2><p class="empty">Der Plan wird nach dem Verbinden geladen.</p>';

    if(t.past)h+='<li><span class="pause">Kein Training eingetragen</span></li>';

      h+='<li><span class="grow"><span class="ttl">'+(t.state==="done"?"✓ ":"")+esc(t.name)+'</span><div class="note">'+(ss?(t.state==="done"?"abgeschlossen · "+doneSets(ss)+" Sätze":"läuft · "+doneSets(ss)+" von "+tot+" Sätzen"):esc(TR().gymNote||""))+'</div></span>'+((isToday||ss)?'<button type="button" class="btn" data-gotrain="'+esc(ss?"":t.unit)+'">'+(ss?"Öffnen":"Starten")+'</button>':"")+'</li>'}

    if(t.ex&&!t.session)h+='<details><summary>Übungen ansehen</summary><table class="ex">'+t.ex.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>').join("")+'</table></details>'}
  h+='</section>';
  const sk=skincare(d),chk=sk.filter(i=>i.id&&!i.opt),n=chk.filter(i=>done(k,i.id)).length;
  h+='<section class="panel"><h2>'+esc(rTitle())+' <small>'+n+' von '+chk.length+' erledigt</small></h2><p class="sub">'+esc(phaseLabel(d))+'</p>';

  let g="";sk.forEach(i=>{if(i.g!==g){if(g)h+='</ul>';g=i.g;h+='<h3>'+g+'</h3><ul class="rows">'}h+=i.info?'<li><span class="pause">'+esc(i.info)+'</span></li>':chkRow(k,i)});
  h+='</ul></section></div></div>'+viewImpulse(d);return h}

function viewWeek(){let h='<div class="weeknav"><button type="button" class="btn" data-week="-1" aria-label="Vorherige Woche">‹</button><strong>KW '+kw(S.week)+' · '+short(S.week)+' bis '+short(add(S.week,6))+'</strong><button type="button" class="btn" data-week="1" aria-label="Nächste Woche">›</button><button type="button" class="btn" data-week="0">Diese Woche</button></div><div class="week">';

    {const w=wxDay(d),wh=whoopDay(d),bits=[];if(w)bits.push(Math.round(w.min)+"–"+Math.round(w.max)+"° · UV "+Math.round(w.uv));if(wh&&wh.rec!=null)bits.push("Recovery "+wh.rec+" %");if(bits.length)h+='<div class="line note">'+esc(bits.join(" · "))+'</div>'}

    h+='<div class="lbl">'+esc(rTitle())+'</div><div class="line">'+sk.filter(x=>!x.hideWeek).map(x=>x.info?'<span class="pause">'+esc(x.s)+'</span>':(done(k,x.id)?"✓ ":"")+esc(x.s)+(x.opt?" (opt.)":"")).join('<br>')+'</div>';

function viewTasks(){const k=key(TODAY),wk=key(add(monday(TODAY),6)),o=openTasks(),by=(a,b)=>(a.due||"9")<(b.due||"9")?-1:1;
  const groups=[["Überfällig",o.filter(t=>t.due&&t.due<k)],["Heute",o.filter(t=>t.due===k)],["Diese Woche",o.filter(t=>t.due>k&&t.due<=wk)],["Später",o.filter(t=>t.due>wk)],["Ohne Datum",o.filter(t=>!t.due)]];

/* ---------- Spruch, Ziele, Geschäftsmodell des Tages ---------- */
const dayNo=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY);
function isoWeekKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);return "W:"+t.getUTCFullYear()+"-W"+String(kw(d)).padStart(2,"0")}
const WKEY=isoWeekKey(TODAY),MKEY="M:"+key(TODAY).slice(0,7);
function viewImpulse(d){const L=S.impulses;if(!L||!L.length)return"";const x=L[dayNo(d)%L.length],F=[["So verdient es Geld",x[2]],["Beispiel",x[3]],["Hebel und Risiko",x[4]],["Für dich",x[5]]].filter(f=>f[1]);
  return '<section class="panel" style="margin-top:16px"><h2>'+esc(x[0])+' <small>Geschäftsmodell des Tages'+(x[1]?" · "+esc(x[1]):"")+'</small></h2><dl class="imp">'+F.map(f=>'<div><dt>'+f[0]+'</dt><dd>'+esc(f[1])+'</dd></div>').join("")+'</dl></section>'}

  const L=S.quotes,q=L.length?L[dayNo(TODAY)%L.length]:null;$("q-text").textContent=q?(q[1]?"„"+q[0]+"“":q[0]):"";$("q-by").textContent=q&&q[1]?q[1]+(q[2]?" · "+q[2]:""):"";
  $("g-week-l").textContent="Ziel der Woche · KW "+kw(TODAY);$("g-month-l").textContent="Ziel im "+MON[TODAY.getMonth()];
  [["g-week",WKEY],["g-month",MKEY]].forEach(p=>{const g=S.goals[p[1]]||{},t=$(p[0]);if(document.activeElement!==t)t.value=g.text||"";$(p[0]+"-d").checked=!!g.done})}
function saveGoal(id,k){const text=$(id).value.trim(),done=$(id+"-d").checked&&!!text;S.goals[k]={text:text,done:done};push({t:"goal",key:k,text:text,done:done});renderFocus()}

/* ---------- Überblick: Wetter und WHOOP ---------- */
const WMO=c=>c===0?"klar":c<=2?"leicht bewölkt":c===3?"bedeckt":c<=48?"Nebel":c<=57?"Nieselregen":c<=67?"Regen":c<=77?"Schnee":c<=82?"Schauer":c<=86?"Schneeschauer":"Gewitter";
const uvText=u=>u<3?"niedrig":u<6?"mittel":u<8?"hoch":u<11?"sehr hoch":"extrem";
function wxDay(d){if(!WX||!WX.daily||!WX.daily.time)return null;const i=WX.daily.time.indexOf(key(d));if(i<0)return null;const D=WX.daily;
  return{code:D.weather_code[i],max:D.temperature_2m_max[i],min:D.temperature_2m_min[i],rain:D.precipitation_probability_max[i],uv:D.uv_index_max[i]}}
function whoopDay(d){return (S.whoop&&S.whoop.days&&S.whoop.days[key(d)])||null}
const de=(x,n)=>x==null?"–":Number(x).toLocaleString("de-DE",{maximumFractionDigits:n==null?1:n});
function viewOverview(d){const w=wxDay(d),wh=whoopDay(d),loc=wxLoc(),T=[];
  if(w){const now=(+d===+TODAY&&WX.cur&&WX.cur.temperature_2m!=null)?"jetzt "+Math.round(WX.cur.temperature_2m)+"° · ":"";
    T.push('<div class="tile"><div class="k">Wetter · '+esc(WX.name||"")+'</div><div class="big">'+Math.round(w.min)+'–'+Math.round(w.max)+'°</div><div class="note">'+now+esc(WMO(w.code))+(w.rain!=null?" · Regen "+Math.round(w.rain)+" %":"")+'</div></div>');
    T.push('<div class="tile"><div class="k">UV-Index</div><div class="big '+(w.uv>=6?"low":w.uv>=3?"mid":"")+'">'+de(w.uv,0)+'</div><div class="note">'+uvText(w.uv)+(w.uv>=3?" · Sonnenschutz":"")+'</div></div>')}
  else if(loc&&+d===+TODAY)T.push('<div class="tile"><div class="k">Wetter · '+esc(loc.name)+'</div><div class="note">'+(WXERR?"gerade nicht erreichbar":"wird geladen …")+'</div></div>');
  if(wh){if(wh.rec!=null)T.push('<div class="tile"><div class="k">Recovery</div><div class="big '+(wh.rec>=67?"good":wh.rec>=34?"mid":"low")+'">'+wh.rec+' %</div><div class="note">HRV '+de(wh.hrv,0)+' · Ruhepuls '+de(wh.rhr,0)+'</div></div>');
    if(wh.sleep!=null)T.push('<div class="tile"><div class="k">Schlaf</div><div class="big">'+de(wh.sleep)+' h</div><div class="note">'+(wh.perf!=null?"Leistung "+wh.perf+" %":"")+'</div></div>');
    if(wh.strain!=null)T.push('<div class="tile"><div class="k">Belastung</div><div class="big">'+de(wh.strain)+'</div><div class="note">WHOOP Strain</div></div>')}
  else if(S.whoop&&S.whoop.connected&&+d===+TODAY)T.push('<div class="tile"><div class="k">WHOOP</div><div class="note">'+(S.whoop.error?"gerade nicht erreichbar":"für heute noch keine Werte")+'</div></div>');
  if(!T.length)return"";
  return '<section class="panel" style="margin-bottom:16px"><div class="tiles">'+T.join("")+'</div>'+(loc?'<div style="margin-top:8px"><button type="button" class="linkbtn" data-goloc="1">Ort ändern</button></div>':"")+'</section>'}

/* ---------- Training: Einheit, Rückblick, Fortschritt, Verlauf ---------- */
const drafts={};
const num=v=>{if(v===""||v==null)return null;const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null};
const kgf=x=>x==null?"":(Math.round(x*100)/100).toLocaleString("de-DE");
const e1rm=(kg,r)=>kg&&r?kg*(1+r/30):0;
const fmtDay=k=>{if(!k)return"–";const d=fromKey(k);return WD[d.getDay()]+" "+short(d)};
const daysAgo=k=>diff(TODAY,fromKey(k));
const fmtRest=x=>x>=120?(x%60?Math.floor(x/60)+":"+String(x%60).padStart(2,"0"):x/60)+" min":x+" s";
function nextUnit(last){const C=(TR().cycle||[]).filter(c=>c.unit).map(c=>c.unit),U=units();if(!C.length)return U.length?U[0].id:"";if(!last)return C[0];return C[(C.indexOf(last.unit)+1)%C.length]}
function activeSession(){const open=byN().filter(x=>!x.done);if(open.length)return open[open.length-1];
  const all=byN(),last=all[all.length-1],n=last?last.n+1:0,t=training(TODAY);
  const sug=(t&&t.gym&&!t.session)?t.unit:nextUnit(last);
  return{id:"s"+String(n).padStart(4,"0"),n:n,unit:S.pickUnit||sug,date:key(TODAY),done:false,sets:{},alts:{},virtual:true}}
function getLive(){const a=activeSession(),f=S.sessions.find(x=>x.id===a.id);return f?Object.assign({},f):a}
function exName(x,i){const e=exOf(x.unit)[i];return (x.alts&&x.alts[i])||(e?e.n:"")}
function lastFor(name,setNo,excl){const l=byN().reverse();for(const x of l){if(x.id===excl||!x.sets)continue;const ex=exOf(x.unit);

  for(let i=0;i<ex.length;i++){if(exName(x,i)!==name)continue;const out=[];for(let k=1;k<=ex[i].s;k++){const v=x.sets[i+"-"+k];if(v&&v.done&&v.kg!=null)out.push(v)}if(out.length)return out}}return null}

function spark(vals){if(vals.length<2)return '<span class="note">–</span>';const w=72,hh=22,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1;

let CFG=LS.get("dash.cfg")||{url:"",token:""};
let Q=LS.get("dash.queue")||[];
(function(){const c=LS.get("dash.state");if(!c)return;S.tasks=c.tasks||[];S.checks=c.checks||{};S.shift=c.shift||0;S.events=c.events||null;S.stampMs=c.stamp||0;PLAN=c.plan||null;S.sessions=c.sessions||[];S.days=c.days||{};S.whoop=c.whoop||null;S.quotes=c.quotes||[];S.impulses=c.impulses||[];S.goals=c.goals||{}})();
function persist(){LS.set("dash.state",{tasks:S.tasks,checks:S.checks,shift:S.shift,events:S.events,stamp:S.stampMs,plan:PLAN,sessions:S.sessions,days:S.days,whoop:S.whoop,quotes:S.quotes,impulses:S.impulses,goals:S.goals})}
function banner(t){const b=$("banner");b.textContent=t;b.hidden=!t}
const stamp=ms=>{const d=new Date(ms);return (+day0(d)===+TODAY?"":short(d)+" ")+hm(d)};
function renderStatus(){const el=$("status");let cls="",txt="";
  if(!CFG.url){cls="bad";txt="Nicht verbunden. Änderungen bleiben nur auf diesem Gerät."}
  else if(Q.length){cls="wait";txt=Q.length+(Q.length===1?" Änderung wartet":" Änderungen warten")+" auf den Upload"+(S.syncErr?" ("+S.syncErr+")":"")}
  else if(S.syncErr){cls="bad";txt=S.syncErr}
  else if(S.sync==="load"){cls="wait";txt="Aktualisiere …"}
  else{cls="ok";txt="Gespeichert"+(S.stampMs?" · Stand "+stamp(S.stampMs):"")}
  el.innerHTML='<span class="dot '+cls+'"></span><span>'+esc(txt)+'</span>';
  S.evStamp=S.stampMs?stamp(S.stampMs):null}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("Zeitüberschreitung")),ms))]);
async function api(payload){
  let r;try{r=await withTimeout(fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},payload,{token:CFG.token}))}),25000)}
  catch(e){throw new Error(navigator.onLine===false?"kein Netz":"Server nicht erreichbar")}
  let j;try{j=await r.json()}catch(e){throw new Error("unerwartete Antwort, Web-App-URL prüfen")}
  if(!j.ok)throw new Error(j.error==="unauthorized"?"Token stimmt nicht":(j.error||"Fehler"));
  return j}
let busy=false;
async function flush(){if(busy||!CFG.url||!Q.length)return;busy=true;
  try{while(Q.length){const n=Math.min(Q.length,40);await api({action:"write",ops:Q.slice(0,n)});Q.splice(0,n);LS.set("dash.queue",Q)}S.syncErr=""}
  catch(e){S.syncErr=e.message}
  busy=false;renderStatus()}
function push(op){Q.push(op);LS.set("dash.queue",Q);persist();renderStatus();flush()}
const RANGE_FROM=add(monday(TODAY),-7),RANGE_TO=add(monday(TODAY),42);
function ensureRange(){if(S.week<RANGE_FROM||add(S.week,6)>=RANGE_TO)S.evMsg="Termine sind nur von "+short(RANGE_FROM)+" bis "+short(add(RANGE_TO,-1))+" geladen.";else S.evMsg="";render()}
let loading=false,lastLoad=0;
async function load(){if(loading||!CFG.url)return;loading=true;S.sync="load";renderStatus();
  try{await flush();
    if(!Q.length){const j=await api({action:"load",fromMs:+RANGE_FROM,toMs:+RANGE_TO,fromKey:key(add(TODAY,-60))});
      S.events=normEvents(j.events);if(j.plan)PLAN=j.plan;S.stampMs=j.at||Date.now();lastLoad=Date.now();
      S.whoop=j.whoop||null;if(j.quotes)S.quotes=j.quotes;if(j.impulses)S.impulses=j.impulses;
      if(!Q.length){S.tasks=j.tasks||[];S.checks=j.checks||{};S.shift=Number(j.shift)||0;if(j.sessions)S.sessions=j.sessions;if(j.days)S.days=j.days;if(j.goals)S.goals=j.goals}
      S.syncErr="";persist()}
  }catch(e){S.syncErr=e.message}
  loading=false;S.sync="";render();loadWx()}

/* ---------- Wetter (Open-Meteo, ohne Anmeldung) ---------- */
let WX=LS.get("dash.wx"),WXERR=false,wxBusy=false;
function wxLoc(){return LS.get("dash.loc")||(PLAN&&PLAN.weather)||null}
async function loadWx(forceWx){const loc=wxLoc();if(!loc||wxBusy)return;const id=loc.lat+","+loc.lon;
  if(!forceWx&&WX&&WX.id===id&&Date.now()-WX.at<30*60000&&WX.daily&&WX.daily.time.indexOf(key(TODAY))>=0)return;
  wxBusy=true;
  try{const r=await withTimeout(fetch("https://api.open-meteo.com/v1/forecast?latitude="+encodeURIComponent(loc.lat)+"&longitude="+encodeURIComponent(loc.lon)+"&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&timezone=auto&forecast_days=10"),15000);
    const j=await r.json();if(!j.daily||!j.daily.time)throw new Error("leer");WX={id:id,at:Date.now(),name:loc.name,cur:j.current||null,daily:j.daily};WXERR=false;LS.set("dash.wx",WX)}
  catch(e){WXERR=true;if(WX&&WX.id!==id)WX=null}
  wxBusy=false;render()}
function showLoc(){const l=wxLoc(),own=LS.get("dash.loc");$("loc-cur").textContent=l?"Aktuell: "+l.name+(own?" (auf diesem Gerät gewählt)":" (Standard)"):"Der Standard-Ort wird nach dem Verbinden geladen."}
$("locform").addEventListener("submit",async e=>{e.preventDefault();const q=$("loc-q").value.trim(),box=$("loc-res");if(q.length<2)return;box.textContent="Suche …";
  try{const r=await withTimeout(fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=de&format=json&name="+encodeURIComponent(q)),15000),j=await r.json();box.textContent="";
    if(!j.results||!j.results.length){box.textContent="Kein Ort gefunden.";return}
    j.results.forEach(x=>{const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=x.name+(x.admin1?", "+x.admin1:"")+(x.country?", "+x.country:"");
      b.addEventListener("click",()=>{LS.set("dash.loc",{name:x.name,lat:x.latitude,lon:x.longitude});box.textContent="";$("loc-q").value="";showLoc();loadWx(true)});box.appendChild(b)})}
  catch(err){box.textContent="Die Ortssuche ist gerade nicht erreichbar."}});
$("loc-reset").addEventListener("click",()=>{try{localStorage.removeItem("dash.loc")}catch(e){}$("loc-res").textContent="";showLoc();loadWx(true)});

function setCheck(k,id,val,info){const cur=S.checks[k]||{done:{},info:{}};const dn=Object.assign({},cur.done),inf=Object.assign({},cur.info);
  if(val){dn[id]=true;if(info)inf[id]=info}else{delete dn[id];delete inf[id]}
  S.checks[k]={done:dn,info:inf};push({t:"check",date:k,id:id,val:!!val,info:info||""});render()}
function taskUpdate(id,patch){const t=S.tasks.find(x=>x.id===id);if(!t)return;Object.assign(t,patch);push({t:"task",task:t});render()}
function taskAdd(title,due,area){const t={id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:title,due:due||"",area:area||"Privat",done:false,doneAt:"",created:Date.now()};S.tasks.push(t);push({t:"task",task:t});render()}
function taskDel(id){S.tasks=S.tasks.filter(t=>t.id!==id);push({t:"taskDel",id:id});render()}

/* ---------- Bedienung ---------- */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;render(true);if(S.tab==="einst")showLoc();window.scrollTo(0,0)});
$("daynav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act;S.day=a==="today"?TODAY:add(S.day,a==="prev"?-1:1);render()});
$("main").addEventListener("change",e=>{const el=e.target;
  if(el.dataset.chk)setCheck(el.dataset.day,el.dataset.chk,el.checked,el.dataset.strength);
  else if(el.dataset.task)taskUpdate(el.dataset.task,{done:el.checked,doneAt:el.checked?Date.now():""});
  else if(el.dataset.due)taskUpdate(el.dataset.due,{due:el.value||""})
  else if(el.dataset.swap!=null){const x=getLive(),i=+el.dataset.swap,e=exOf(x.unit)[i];x.alts=Object.assign({},x.alts||{});if(e&&el.value===e.n)delete x.alts[i];else x.alts[i]=el.value;if(x.virtual){delete x.virtual;x.date=key(TODAY)}persistSession(x);render(true)}
  else if(el.id&&el.id.indexOf("rir-")===0)drafts[el.id]=el.value;
  else if(el.id==="tr-sauna")saveDay(el.dataset.day,{sauna:num(el.value)});
  else if(el.id==="tr-weight")saveDay(el.dataset.day,{weight:num(el.value)});
  else if(el.id==="tr-note"){const x=getLive();if(!x.virtual){x.note=el.value.trim();persistSession(x)}}});
$("main").addEventListener("input",e=>{const t=e.target;if(t.id&&/^(kg|rp)-/.test(t.id)){drafts[t.id]=t.value;t.classList.remove("tgt")}});
$("main").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input.num")){const ins=[].slice.call(document.querySelectorAll("#main input.num")),i=ins.indexOf(e.target);if(ins[i+1]){e.preventDefault();ins[i+1].focus()}}});
$("main").addEventListener("toggle",e=>{const d=e.target.closest&&e.target.closest("details[data-hist]");if(d)S.openHist=d.open?d.dataset.hist:null},true);
[["g-week",WKEY],["g-month",MKEY]].forEach(p=>{$(p[0]).addEventListener("change",()=>saveGoal(p[0],p[1]));$(p[0]+"-d").addEventListener("change",()=>saveGoal(p[0],p[1]));$(p[0]).addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()})});
$("tMinus").onclick=()=>{timerEnd-=15000;tick()};$("tPlus").onclick=()=>{timerEnd+=15000;tick()};$("tStop").onclick=stopTimer;
let delArmed=null;
$("main").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const ds=b.dataset;
  if(ds.edit){S.openTask=S.openTask===ds.edit?null:ds.edit;delArmed=null;render()}
  else if(ds.move){taskUpdate(ds.move,{due:ds.to})}
  else if(ds.del){if(delArmed===ds.del){delArmed=null;taskDel(ds.del)}else{delArmed=ds.del;b.textContent="Wirklich löschen?"}}
  else if(ds.open){S.day=fromKey(ds.open);S.tab="heute";render();window.scrollTo(0,0)}
  else if(ds.week!==undefined&&ds.week!==""){S.week=ds.week==="0"?monday(TODAY):add(S.week,7*Number(ds.week));ensureRange()}
  else if(ds.gotrain!==undefined){if(ds.gotrain)S.pickUnit=ds.gotrain;S.tab="training";S.trSub="einheit";render(true);window.scrollTo(0,0)}
  else if(ds.goloc){S.tab="einst";render(true);showLoc();$("loc-q").focus()}
  else if(ds.trsub){S.trSub=ds.trsub;render(true);window.scrollTo(0,0)}
  else if(ds.trwk){S.weekOff=Math.min(0,S.weekOff+Number(ds.trwk));render(true)}
  else if(ds.unit){S.pickUnit=ds.unit;const x=getLive();if(!x.virtual){x.unit=ds.unit;x.alts={};persistSession(x)}render(true)}
  else if(ds.check){const ky=ds.check,x=getLive();x.sets=Object.assign({},x.sets||{});const cur=x.sets[ky]||{},kgIn=$("kg-"+ky),rpIn=$("rp-"+ky),rirIn=$("rir-"+ky);
    if(cur.done&&!kgIn.value&&!rpIn.value){delete x.sets[ky];persistSession(x);render(true);return}
    const kg=num(kgIn.value),reps=num(rpIn.value),rir=rirIn.value===""?null:+rirIn.value;
    if(cur.done&&cur.kg===kg&&cur.reps===reps&&cur.rir===rir){x.sets[ky]=Object.assign({},cur,{done:false});persistSession(x);render(true);return}
    x.sets[ky]={kg:kg,reps:reps,rir:rir,done:true,t:new Date().toISOString()};delete drafts["kg-"+ky];delete drafts["rp-"+ky];delete drafts["rir-"+ky];
    if(x.virtual){delete x.virtual;x.date=key(TODAY)}
    persistSession(x);startTimer(Number(ds.rest)||90);render(true)}
  else if(b.id==="tr-finish"){const x=getLive();if(x.virtual)return;x.done=true;x.note=$("tr-note").value.trim();persistSession(x);S.pickUnit=null;stopTimer();render(true);window.scrollTo(0,0)}
  else if(ds.reopen){const x=S.sessions.find(y=>y.id===ds.reopen);if(!x)return;if(byN().some(y=>!y.done&&y.id!==x.id)){banner("Erst die laufende Einheit abschließen.");return}banner("");persistSession(Object.assign({},x,{done:false}));S.trSub="einheit";render(true);window.scrollTo(0,0)}
  else if(ds.toggledone){S.showDone=!S.showDone;render()}});
$("addform").addEventListener("submit",e=>{e.preventDefault();const t=$("add-title").value.trim();if(!t)return;taskAdd(t,$("add-due").value,$("add-area").value);$("add-title").value="";$("add-title").focus()});
$("cfg-url").value=CFG.url;$("cfg-token").value=CFG.token;
$("cfgform").addEventListener("submit",async e=>{e.preventDefault();const u=$("cfg-url").value.trim(),t=$("cfg-token").value.trim(),m=$("cfg-msg");
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)&&!/^http:\/\/(localhost|127\.0\.0\.1)/.test(u)){m.textContent="Die URL muss mit https://script.google.com/ beginnen und auf /exec enden.";return}
  CFG={url:u,token:t};m.textContent="Verbinde …";S.syncErr="";
  await load();
  if(S.syncErr){m.textContent="Verbindung fehlgeschlagen: "+S.syncErr+"."}else{LS.set("dash.cfg",CFG);m.textContent="Verbunden. Daten sind geladen."}
  if(S.syncErr)CFG=LS.get("dash.cfg")||{url:"",token:""};renderStatus()});
$("reload").addEventListener("click",()=>load());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;if(+day0(new Date())!==+TODAY){location.reload();return}if(Date.now()-lastLoad>120000)load();else flush()});
window.addEventListener("online",()=>{flush().then(()=>{if(Date.now()-lastLoad>120000)load()})});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();load();loadWx();
})();
</script>
</body>
</html>
